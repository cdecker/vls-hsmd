cache:
  paths:
    - .cache

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  SUBDAEMON:
    value: "hsmd:remote_hsmd_vls"
    description: "use the inplace hsmd replacement (default), or the standalone version `hsmd:remote_hsmd` or the socket version: `hsmd:remote_hsmd_socket`"
  LIGHTNING_REF:
    value: ""
    description: "rebase onto the ref (e.g. master) from the upstream c-lightning repository"

stages:
  - vls
  - test

compile-vls:
  stage: vls
  image: rust:1.58.1
  timeout: 30m
  script:
    # we don't need to rebase lightning here, but fail fast if rebase fails
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    # latest rust images seem to require rustfmt for cargo build
    - rustup component add rustfmt
    - (cd vls && cargo build --locked --bins)
    - mkdir -p bin
    - cp vls/target/debug/vlsd bin/
    - cp vls/target/debug/remote_hsmd_{vls,socket,socket_test,serial} bin/
    - ls -l bin
  artifacts:
    paths:
      - bin/vlsd
      - bin/remote_hsmd_vls
      - bin/remote_hsmd_socket
      - bin/remote_hsmd_socket_test
      - bin/remote_hsmd_serial

test-inplace-standard:
  stage: test
  image: ubuntu
  script:
    - ./scripts/install-additional
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - cd lightning
    - bash -ex .github/scripts/setup.sh  # missing `set -e` internally
    - bash -ex .github/scripts/build.sh  # missing `set -e` internally

test-inplace:
  stage: test
  image: ubuntu
  variables:
    EXPERIMENTAL_FEATURES: "1"
  script:
    - ./scripts/install-additional
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - cd lightning
    - bash -ex .github/scripts/setup.sh  # missing `set -e` internally
    - bash -ex .github/scripts/build.sh  # missing `set -e` internally

test-standalone:
  stage: test
  image: ubuntu
  variables:
    EXPERIMENTAL_FEATURES: "1"
    SUBDAEMON: hsmd:remote_hsmd
  script:
    - ./scripts/install-additional
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - cd lightning
    - bash -ex .github/scripts/setup.sh  # missing `set -e` internally
    - bash -ex .github/scripts/build.sh  # missing `set -e` internally

test-socket:
  stage: test
  image: ubuntu
  variables:
    EXPERIMENTAL_FEATURES: "1"
    SUBDAEMON: hsmd:remote_hsmd_socket_test
  script:
    - ./scripts/install-additional
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - cd lightning
    - bash -ex .github/scripts/setup.sh  # missing `set -e` internally
    # - export PYTEST_ADDOPTS="-ktest_pay"
    - bash -ex .github/scripts/build.sh  # missing `set -e` internally

