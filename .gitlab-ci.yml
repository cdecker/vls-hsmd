cache:
  paths:
    - .cache

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  SUBDAEMON:
    value: "hsmd:remote_hsmd_vls"
    description: "use the single-binary hsmd replacement (default), or the gRPC version `hsmd:remote_hsmd`"
  LIGHTNING_REF:
    value: ""
    description: "rebase onto the ref (e.g. master) from the upstream c-lightning repository"

stages:
  - vls
  - test

compile-vls:
  stage: vls
  image: rust:1.48.0
  timeout: 30m
  script:
    # we don't need to rebase lightning here, but fail fast if rebase fails
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - (cd vls && cargo install --locked --path lightning-signer-server)
    - (cd greenlight-signer && cargo install --locked --path greenlight-signer-hsmd)
    - ls -l $CARGO_HOME/bin
    - mkdir -p bin
    - cp $CARGO_HOME/bin/{vlsd,remote_hsmd_vls} bin/
  artifacts:
    paths:
      - bin/vlsd
      - bin/remote_hsmd_vls

test:
  stage: test
  image: ubuntu
  script:
    - ls -l
    - ls -l bin
    - ./scripts/install-additional
    - python3 --version
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - cd lightning
    - bash -ex .github/scripts/setup.sh  # missing `set -e` internally
    - bash -ex .github/scripts/build.sh  # missing `set -e` internally

test-experimental:
  stage: test
  image: ubuntu
  variables:
    EXPERIMENTAL_FEATURES: "1"
  script:
    - ./scripts/install-additional
    - ./scripts/maybe-rebase "$LIGHTNING_REF"
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - cd lightning
    - bash -ex .github/scripts/setup.sh  # missing `set -e` internally
    - bash -ex .github/scripts/build.sh  # missing `set -e` internally
