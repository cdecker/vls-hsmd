version: '3'
output: "prefixed"
env:
  CARGO_TARGET_DIR: "{{ .ROOT_DIR }}/target"

tasks:

  build-vls:
    dir: 'vls'
    deps:
      - build-lssd
    cmds:
      - CARGO_TARGET_DIR=../target cargo build --all --features developer

  build-lssd:
    dir: 'vls/lightning-storage-server'
    cmds:
      - CARGO_TARGET_DIR=../../target cargo build --all

  patch-contrib-pyproject:
    desc: "Patch pyproject.toml files in lightning/contrib to add [project] tables for uv compatibility"
    cmds:
      - ./scripts/patch_all_contrib.sh
    status:
      - "grep -q '^\\[project\\]' lightning/contrib/pyln-client/pyproject.toml"
      - "grep -q '^\\[project\\]' lightning/contrib/pyln-testing/pyproject.toml"

  configure-cln:
    dir: 'lightning'
    deps:
      - patch-contrib-pyproject
    cmds:
      - ../scripts/build-lightning.sh ./configure --disable-valgrind CC='clang'
    status:
      - "[ -f config.vars ]"
      
  build-cln:
    dir: 'lightning'
    sources:
     - '**/*.c'
     - '**/*.h'
    generates:
     - 'lightningd/lightningd'
    deps:
      - configure-cln
    cmds:
      - uv venv
      - uv pip install contrib/pyln-testing contrib/pyln-client
      - CARGO_TARGET_DIR=../target uv run ../scripts/build-lightning.sh make -j ${MAKE_JOBS:-$(nproc)}
      - touch __init__.py tests/__init__.py  # Make lightning/ importable as a Python package
  build:
    deps:
      - build-vls
      - build-cln

  test-native:
    env:
      VLS_MODE: "cln:native"
      SUBDAEMON: "hsmd:lightning_hsmd"
      VALGRIND: "0"
      SLOW_MACHINE: "1"
    cmds:
      - uv sync
      - PATH="$PATH:{{.ROOT_DIR}}/target/debug:{{.ROOT_DIR}}/lightning/lightningd" uv run pytest tests -vvv --color=yes --timeout=180 {{ .CLI_ARGS }}

  test-native-single:
    env:
      VLS_MODE: "cln:native"
      SUBDAEMON: "hsmd:lightning_hsmd"
      VALGRIND: "0"
      SLOW_MACHINE: "1"
    cmds:
      - uv sync
      - PATH="$PATH:{{.ROOT_DIR}}/target/debug:{{.ROOT_DIR}}/lightning/lightningd" uv run pytest tests -vvv --color=yes -k {{ .CLI_ARGS }} --timeout=180

  test-native-*:
    env:
      VLS_MODE: "cln:native"
      SUBDAEMON: "hsmd:lightning_hsmd"
      VALGRIND: "0"
      SLOW_MACHINE: "1"
    cmds:
      - uv sync
      - PATH="$PATH:{{.ROOT_DIR}}/target/debug:{{.ROOT_DIR}}/lightning/lightningd" uv run pytest "tests/test_$(echo {{index .MATCH 0}} | tr - _).py" -vvv --color=yes --timeout=180 -n 5 {{ .CLI_ARGS }}

  test-vls-socket:
    env:
      VLS_MODE: "cln:socket"
      ALLOWLIST: "{{ .ROOT_DIR }}/remote_hsmd/TESTING_ALLOWLIST"
      VLS_CLN_VERSION:
        sh: ./lightning/lightningd/lightning_hsmd --version
      SUBDAEMON: "hsmd:{{ .ROOT_DIR }}/target/debug/remote_hsmd_socket"
      VLS_NETWORK: regtest
      VLS_PERMISSIVE: 1
      TEST_DEBUG: 1
      RUST_BACKTRACE: full
      VALGRIND: "0"
      SLOW_MACHINE: "1"
      PATH:
        sh: echo "$PATH:{{ .ROOT_DIR }}/target/debug:{{ .ROOT_DIR }}/lightning/lightningd:"
    deps:
      - build
    cmds:
      - uv sync
      - PATH="$PATH:{{.ROOT_DIR}}/target/debug:{{.ROOT_DIR}}/lightning/lightningd" uv run pytest tests -vvv --color=yes -n 5 --timeout=180 {{ .CLI_ARGS }}

  test-vls-socket-single:
    env:
      VLS_MODE: "cln:socket"
      ALLOWLIST: "{{ .ROOT_DIR }}/remote_hsmd/TESTING_ALLOWLIST"
      VLS_CLN_VERSION:
        sh: ./lightning/lightningd/lightning_hsmd --version
      SUBDAEMON: "hsmd:{{ .ROOT_DIR }}/target/debug/remote_hsmd_socket"
      VLS_NETWORK: regtest
      VLS_PERMISSIVE: 1
      TEST_DEBUG: 1
      RUST_BACKTRACE: full
      VALGRIND: "0"
      SLOW_MACHINE: "1"
      PATH:
        sh: echo "$PATH:{{ .ROOT_DIR }}/target/debug:{{ .ROOT_DIR }}/lightning/lightningd:"
    deps:
      - build
    cmds:
      - uv sync
      - PATH="$PATH:{{.ROOT_DIR}}/target/debug:{{.ROOT_DIR}}/lightning/lightningd" uv run pytest tests -vvv --color=yes -k {{ .CLI_ARGS }} --timeout=180

  test-vls-socket-*:
    env:
      VLS_MODE: "cln:socket"
      ALLOWLIST: "{{ .ROOT_DIR }}/remote_hsmd/TESTING_ALLOWLIST"
      VLS_CLN_VERSION:
        sh: ./lightning/lightningd/lightning_hsmd --version
      SUBDAEMON: "hsmd:{{ .ROOT_DIR }}/target/debug/remote_hsmd_socket"
      VLS_NETWORK: regtest
      VLS_PERMISSIVE: 1
      TEST_DEBUG: 1
      RUST_BACKTRACE: full
      VALGRIND: "0"
      SLOW_MACHINE: "1"
      PATH:
        sh: echo "$PATH:{{ .ROOT_DIR }}/target/debug:{{ .ROOT_DIR }}/lightning/lightningd:"
    deps:
      - build
    cmds:
      - uv sync
      - PATH="$PATH:{{.ROOT_DIR}}/target/debug:{{.ROOT_DIR}}/lightning/lightningd" uv run pytest "tests/test_$(echo {{index .MATCH 0}} | tr - _).py" -vvv --color=yes -n 5 --timeout=180 {{ .CLI_ARGS }}

  clean:
    deps:
      - cln-clean
      - vls-clean
  cln-clean:
    directory: '.'
    cmds:
      - rm -rf target
  vls-clean:
    directory: 'vls'
    cmds:
      - make clean
      

  docker-image:
    cmds:
      - docker build -t vls-hsmd-tester -f Dockerfile .
  docker-test:
    deps:
      - docker-image
    cmds:
      - docker run --ulimit nofile=10240:10240 -ti -v {{ .ROOT_DIR }}:/repo -v /repo/.venv vls-hsmd-tester task test-vls-socket

  dockerize-*:
    deps:
      - docker-image
    cmds:
      - docker run --ulimit nofile=10240:10240 -ti -v {{ .ROOT_DIR }}:/repo -v /repo/.venv vls-hsmd-tester task {{index .MATCH 0}} -- {{.CLI_ARGS}}
