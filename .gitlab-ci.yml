cache:
  paths:
    - .cache

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  SUBDAEMON:
    value: "hsmd:remote_hsmd_inplace"
    description: "use the inplace hsmd replacement (default), or the socket version: `hsmd:remote_hsmd_socket`"
  LIGHTNING_REF:
    value: ""
    description: "rebase onto the ref (e.g. master) from the upstream c-lightning repository"

get-bitcoin:
  image: python:3.8
  cache:
    key: vls-bitcoin
    paths:
      - bin
  script:
    - BITCOIN_VERSION=24.0.1
    - mkdir -p bin
    - ls -l bin
    - if [ ! -e bin/bitcoind ]; then
        wget https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz &&
        tar -xf bitcoin-$BITCOIN_VERSION-x86_64-linux-gnu.tar.gz &&
        mv bitcoin-$BITCOIN_VERSION/bin/* bin ;
      fi
  artifacts:
    paths:
      - bin/bitcoind
      - bin/bitcoin-cli

compile-vls:
  tags: [ saas-linux-large-amd64 ]
  image: rust:1.60.0
  timeout: 30m
  script:
    # we don't need to rebase lightning here, but fail fast if rebase fails
    # - ./scripts/maybe-rebase "$LIGHTNING_REF"
    # latest rust images seem to require rustfmt for cargo build
    - apt-get update
    - apt-get install -y protobuf-compiler
    - rustup component add rustfmt
    - make setup
    - make list-versions
    - (cd vls && git status)
    - (cd vls && git clean -f && cargo clean)
    - (cd vls/lightning-storage-server && git clean -f && cargo clean)
    - (cd vls && git status)
    - (cd vls && cargo build --locked --bins)
    - (cd vls/lightning-storage-server && cargo build --locked --bins)
    # replace the symbolic links w/ actual files
    - mkdir -p newbin && cp -L bin/* newbin/ && rm -rf bin && mv newbin bin
    - ls -l bin
    - bin/remote_hsmd_inplace --git-desc
    - bin/remote_hsmd_socket --git-desc
  artifacts:
    paths:
      - bin/vlsd2
      - bin/lssd
      - bin/remote_hsmd_inplace
      - bin/remote_hsmd_socket
      - bin/remote_hsmd_serial

compile-experimental:
  tags: [ saas-linux-large-amd64 ]
  image: ubuntu
  variables:
    EXPERIMENTAL_FEATURES: "1"
  script:
    - ./scripts/install-additional
    - git submodule update --init --recursive
    - make list-versions
    - cd lightning
    - bash -x .github/scripts/setup.sh
    - bash -x ../scripts/ci-build.sh
    - zip ../bin-experimental.zip $(find lightningd cli plugins tools devtools tests/plugins -executable -type f) config.vars
  artifacts:
    paths:
      - bin-experimental.zip

compile-standard:
  tags: [ saas-linux-large-amd64 ]
  image: ubuntu
  script:
    - ./scripts/install-additional
    - git submodule update --init --recursive
    - make list-versions
    - cd lightning
    - bash -x .github/scripts/setup.sh
    - bash -x ../scripts/ci-build.sh
    - zip ../bin-standard.zip $(find lightningd cli plugins tools devtools tests/plugins -executable -type f) config.vars
  artifacts:
    paths:
      - bin-standard.zip

test-inplace-standard:
  tags: [ saas-linux-large-amd64 ]
  image: ubuntu
  needs:
    - compile-standard
    - compile-vls
    - get-bitcoin
  variables:
    VLS_ONCHAIN_VALIDATION_DISABLE: "1"
  script:
    - ./scripts/install-additional
    - git submodule update --init --recursive
    - make list-versions
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - remote_hsmd_inplace --git-desc
    - cd lightning
    - unzip -o ../bin-standard.zip
    - bash -x ../scripts/ci-test.sh

test-inplace:
  tags: [ saas-linux-large-amd64 ]
  image: ubuntu
  needs:
    - compile-experimental
    - compile-vls
    - get-bitcoin
  variables:
    EXPERIMENTAL_FEATURES: "1"
    VLS_ONCHAIN_VALIDATION_DISABLE: "1"
  script:
    - ./scripts/install-additional
    - git submodule update --init --recursive
    - make list-versions
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - remote_hsmd_inplace --git-desc
    - cd lightning
    - unzip -o ../bin-experimental.zip
    - bash -x ../scripts/ci-test.sh

test-socket:
  tags: [ saas-linux-large-amd64 ]
  image: ubuntu
  needs:
    - compile-experimental
    - compile-vls
    - get-bitcoin
  variables:
    EXPERIMENTAL_FEATURES: "1"
    SUBDAEMON: hsmd:remote_hsmd_socket
  script:
    - ./scripts/install-additional
    - git submodule update --init --recursive
    - make list-versions
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - remote_hsmd_socket --git-desc
    - vlsd2 --git-desc
    - cd lightning
    - unzip -o ../bin-experimental.zip
    - bash -x ../scripts/ci-test.sh

test-permissive:
  tags: [ saas-linux-large-amd64 ]
  image: ubuntu
  needs:
    - compile-experimental
    - compile-vls
    - get-bitcoin
  variables:
    EXPERIMENTAL_FEATURES: "1"
    VLS_PERMISSIVE: "1"
    SUBDAEMON: hsmd:remote_hsmd_socket
  script:
    - ./scripts/install-additional
    - git submodule update --init --recursive
    - make list-versions
    - ./scripts/setup-remote-hsmd
    - source scripts/setup-env
    - remote_hsmd_socket --git-desc
    - cd lightning
    - unzip -o ../bin-experimental.zip
    - bash -x ../scripts/ci-test.sh
